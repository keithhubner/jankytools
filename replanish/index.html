<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replanish</title>
<script src="/md.js"></script>
<style>
  :root {
    --bg: #1a1b1e;
    --panel: #232427;
    --panel-2: #2b2d31;
    --border: #3a3d42;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #c9885a;
    --accent-soft: #3a2f27;
    --hit: #5a4a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  header .accent { color: var(--accent); }
  #search {
    flex: 1; padding: 7px 11px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 14px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); padding: 6px 11px; border-radius: 6px; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: #7a3b3b; color: #e57373; }
  button.danger:hover { background: #3a2727; border-color: #e57373; }

  main { display: flex; flex: 1; min-height: 0; }

  #sidebar {
    width: 340px; flex: 0 0 340px; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  .filters { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .filters label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=date], .row select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 7px; font-size: 13px; flex: 1; min-width: 0;
  }
  .quick button { padding: 4px 9px; font-size: 12px; }
  #count { font-size: 12px; color: var(--muted); padding: 8px 12px; }

  #bulkbar {
    display: none; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
  }
  #bulkbar #bulkcount { flex: 1; font-size: 13px; color: var(--muted); }
  #bulkbar button { padding: 4px 9px; font-size: 12px; }

  #list { overflow-y: auto; flex: 1; min-height: 0; }
  .item {
    padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .item:hover { background: var(--panel-2); }
  .item.selected { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 9px; }
  .item .sel { margin: 3px 0 0; flex: 0 0 auto; cursor: pointer; accent-color: var(--accent); }
  .item .body { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; margin-bottom: 3px; }
  .item .t.untitled { font-weight: 400; font-style: italic; color: var(--muted); }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .item .badge { color: var(--accent); font-size: 11px; }

  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex: 0 0 auto;
  }
  #toolbar .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #content { overflow-y: auto; padding: 24px 32px; flex: 1; min-height: 0; }
  #content.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); }

  /* rendered markdown */
  .md h1, .md h2, .md h3 { line-height: 1.25; }
  .md h1 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md h2 { font-size: 18px; margin-top: 1.6em; }
  .md h3 { font-size: 15px; }
  .md code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .md pre { background: var(--panel-2); padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; border: 1px solid var(--border); }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 2px 14px; color: var(--muted); }
  .md a { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
  .md table { border-collapse: collapse; }
  #raw { white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  /* settings modal */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  .dialog {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px; width: 540px; max-width: calc(100vw - 40px);
  }
  .dialog h2 { margin: 0 0 14px; font-size: 16px; }
  .dialog label { display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .dialog input[type=text] {
    width: 100%; padding: 8px 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dialog input[type=text]:focus { outline: none; border-color: var(--accent); }
  .dialog .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dialog .hint code { color: var(--text); }
  .dialog .err { font-size: 13px; color: #e57373; margin-top: 10px; min-height: 1em; }
  .dialog .actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #1a1b1e; padding: 9px 18px; border-radius: 8px;
    font-weight: 600; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1><span class="accent">◆</span> Replanish</h1>
    <input id="search" type="search" placeholder="Search filename, title and body text…" autocomplete="off">
    <button id="settings" title="Change the plans directory">⚙ Settings</button>
    <button id="refresh" title="Reload plans from disk">↻ Refresh</button>
  </header>

  <main>
    <aside id="sidebar">
      <div class="filters">
        <div>
          <label>Modified between</label>
          <div class="row">
            <input id="from" type="date" title="From date">
            <input id="to" type="date" title="To date">
          </div>
          <div class="row quick">
            <button data-days="7">7 days</button>
            <button data-days="30">30 days</button>
            <button data-days="0">All</button>
          </div>
        </div>
        <div>
          <label>Sort</label>
          <div class="row">
            <select id="sort">
              <option value="mtime_desc">Newest first</option>
              <option value="mtime_asc">Oldest first</option>
              <option value="title_asc">Title A–Z</option>
              <option value="size_desc">Largest first</option>
            </select>
          </div>
        </div>
        <div>
          <label>Delete plans from the last…</label>
          <div class="row quick">
            <button class="danger" data-del-days="5">5 days</button>
            <button class="danger" data-del-days="10">10 days</button>
            <button class="danger" data-del-days="30">30 days</button>
          </div>
        </div>
      </div>
      <div id="count"></div>
      <div id="bulkbar">
        <span id="bulkcount"></span>
        <button id="bulkClear">Clear</button>
        <button id="bulkDelete" class="danger">Delete selected</button>
      </div>
      <div id="list"></div>
    </aside>

    <section id="pane">
      <div id="toolbar" style="display:none">
        <span class="path" id="path"></span>
        <button id="copy">Copy</button>
        <button id="copyPath">Copy path</button>
        <button id="toggleRaw">Raw</button>
        <button id="delete" class="danger">Delete</button>
      </div>
      <div id="content" class="empty">Select a plan to read it.</div>
    </section>
  </main>

  <div id="modal" style="display:none">
    <div class="dialog">
      <h2>Settings</h2>
      <label for="planDir">Plans directory</label>
      <input id="planDir" type="text" spellcheck="false" autocomplete="off"
             placeholder="/path/to/plans">
      <div class="hint">Default: <code id="defaultDir"></code></div>
      <div class="err" id="modalErr"></div>
      <div class="actions">
        <button id="useDefault">Use default</button>
        <span style="flex:1"></span>
        <button id="cancelCfg">Cancel</button>
        <button id="saveCfg" class="active">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  "use strict";

  var plans = [];          // full list from /api/plans
  var bySlug = {};
  var selected = null;     // currently open plan object
  var showRaw = false;
  var selectedSlugs = new Set(); // checkbox selection for bulk delete

  var el = function (id) { return document.getElementById(id); };

  // --- formatting helpers ---------------------------------------------------
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
         + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fmtSize(n) {
    if (n < 1024) return n + " B";
    return (n / 1024).toFixed(1) + " KB";
  }
  function dayKey(iso) { return iso.slice(0, 10); } // YYYY-MM-DD in local tz from ISO

  // --- toast ----------------------------------------------------------------
  var toastTimer = null;
  function toast(msg) {
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }

  // --- clipboard ------------------------------------------------------------
  function copyText(text, label) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      toast(label);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(label); }, fallback);
    } else {
      fallback();
    }
  }

  // --- filtering & sorting --------------------------------------------------
  function currentFiltered() {
    var q = el("search").value.trim().toLowerCase();
    var from = el("from").value; // "" or YYYY-MM-DD
    var to = el("to").value;
    var sort = el("sort").value;

    var out = plans.filter(function (p) {
      if (from && dayKey(p.mtime_iso) < from) return false;
      if (to && dayKey(p.mtime_iso) > to) return false;
      if (q) {
        var inMeta = p.filename.toLowerCase().indexOf(q) !== -1
                  || (p.title || "").toLowerCase().indexOf(q) !== -1;
        var inBody = p.raw.toLowerCase().indexOf(q) !== -1;
        if (!inMeta && !inBody) return false;
        p._bodyHit = !inMeta && inBody;
      } else {
        p._bodyHit = false;
      }
      return true;
    });

    out.sort(function (a, b) {
      switch (sort) {
        case "mtime_asc": return a.mtime - b.mtime;
        case "title_asc": return (a.title || "").localeCompare(b.title || "");
        case "size_desc": return b.size - a.size;
        default: return b.mtime - a.mtime; // mtime_desc
      }
    });
    return out;
  }

  function renderList() {
    var items = currentFiltered();
    var list = el("list");
    list.innerHTML = "";
    items.forEach(function (p) {
      var div = document.createElement("div");
      div.className = "item" + (selected && selected.slug === p.slug ? " selected" : "");
      div.dataset.slug = p.slug;

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "sel";
      cb.checked = selectedSlugs.has(p.slug);
      cb.title = "Select for bulk delete";
      cb.addEventListener("click", function (e) { e.stopPropagation(); });
      cb.addEventListener("change", function () {
        if (cb.checked) selectedSlugs.add(p.slug); else selectedSlugs.delete(p.slug);
        updateBulkBar();
      });
      div.appendChild(cb);

      var body = document.createElement("div");
      body.className = "body";

      var t = document.createElement("div");
      t.className = "t" + (p.has_title ? "" : " untitled");
      t.textContent = p.title;
      body.appendChild(t);

      var meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "<span>" + fmtDate(p.mtime_iso) + "</span>"
                     + "<span>" + fmtSize(p.size) + "</span>"
                     + (p._bodyHit ? "<span class='badge'>matches text</span>" : "");
      body.appendChild(meta);

      body.addEventListener("click", function () { open(p.slug); });
      div.appendChild(body);
      list.appendChild(div);
    });

    var total = plans.length;
    el("count").textContent = items.length === total
      ? total + " plan" + (total === 1 ? "" : "s")
      : items.length + " of " + total + " plans";
    updateBulkBar();
  }

  function updateBulkBar() {
    var n = selectedSlugs.size;
    el("bulkbar").style.display = n ? "flex" : "none";
    el("bulkcount").textContent = n + " selected";
  }

  // --- deletion -------------------------------------------------------------
  function deletePlans(slugs, what) {
    slugs = slugs.filter(function (s) { return bySlug[s]; }); // only existing
    if (!slugs.length) { toast("Nothing to delete"); return; }
    var n = slugs.length;
    var msg = "Permanently delete " + n + " plan" + (n === 1 ? "" : "s")
            + (what ? " " + what : "") + "?\n\nThis cannot be undone.";
    if (!window.confirm(msg)) return;

    fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slugs: slugs }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var done = (res.deleted || []);
        done.forEach(function (s) { selectedSlugs.delete(s); });
        if (selected && done.indexOf(selected.slug) !== -1) {
          selected = null;
          location.hash = "";
        }
        return load().then(function () {
          var failed = (res.failed || []).length;
          toast("Deleted " + done.length + (failed ? ", " + failed + " failed" : ""));
        });
      })
      .catch(function () { toast("Delete failed"); });
  }

  // --- reading pane ---------------------------------------------------------
  function renderContent() {
    var content = el("content");
    if (!selected) {
      content.className = "empty";
      content.textContent = "Select a plan to read it.";
      el("toolbar").style.display = "none";
      return;
    }
    el("toolbar").style.display = "flex";
    el("path").textContent = selected.path;
    el("path").title = selected.path;
    el("toggleRaw").classList.toggle("active", showRaw);
    el("toggleRaw").textContent = showRaw ? "Rendered" : "Raw";

    content.className = "";
    if (selected.raw === "") {
      content.innerHTML = "<p style='color:var(--muted)'>(empty file)</p>";
      return;
    }
    if (showRaw) {
      var pre = document.createElement("pre");
      pre.id = "raw";
      pre.textContent = selected.raw;
      content.innerHTML = "";
      content.appendChild(pre);
    } else {
      try {
        content.innerHTML = "<div class='md'>" + window.renderMarkdown(selected.raw) + "</div>";
      } catch (e) {
        var pre2 = document.createElement("pre");
        pre2.id = "raw";
        pre2.textContent = selected.raw;
        content.innerHTML = "";
        content.appendChild(pre2);
      }
    }
    content.scrollTop = 0;
  }

  function open(slug) {
    var p = bySlug[slug];
    if (!p) return;
    selected = p;
    location.hash = "#" + encodeURIComponent(slug);
    renderContent();
    renderList(); // update selection highlight
  }

  // --- data load ------------------------------------------------------------
  function load() {
    return fetch("/api/plans", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        plans = data.plans || [];
        bySlug = {};
        plans.forEach(function (p) { bySlug[p.slug] = p; });

        // Drop any checkbox selections whose files no longer exist.
        Array.from(selectedSlugs).forEach(function (s) {
          if (!bySlug[s]) selectedSlugs.delete(s);
        });

        // Re-bind current selection (it may have changed on disk).
        if (selected) {
          var fresh = bySlug[selected.slug];
          if (fresh) { selected = fresh; }
          else {
            selected = null;
            el("content").className = "empty";
            el("content").textContent = "This plan no longer exists. It may have been deleted.";
            el("toolbar").style.display = "none";
          }
        }
        renderList();
        if (selected) renderContent();

        // Open from URL hash on first load.
        if (!selected && location.hash.length > 1) {
          var slug = decodeURIComponent(location.hash.slice(1));
          if (bySlug[slug]) open(slug);
        }
      })
      .catch(function () {
        el("count").textContent = "Failed to load plans.";
      });
  }

  // --- wiring ---------------------------------------------------------------
  el("search").addEventListener("input", renderList);
  el("from").addEventListener("change", renderList);
  el("to").addEventListener("change", renderList);
  el("sort").addEventListener("change", renderList);

  document.querySelectorAll(".quick button").forEach(function (b) {
    b.addEventListener("click", function () {
      var days = parseInt(b.dataset.days, 10);
      if (days === 0) {
        el("from").value = "";
        el("to").value = "";
      } else {
        var now = new Date();
        var past = new Date(now.getTime() - days * 86400000);
        var p = function (n) { return String(n).padStart(2, "0"); };
        var key = function (d) {
          return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
        };
        el("from").value = key(past);
        el("to").value = key(now);
      }
      renderList();
    });
  });

  el("copy").addEventListener("click", function () {
    if (selected) copyText(selected.raw, "Copied markdown");
  });
  el("copyPath").addEventListener("click", function () {
    if (selected) copyText(selected.path, "Copied path");
  });
  el("toggleRaw").addEventListener("click", function () {
    showRaw = !showRaw;
    renderContent();
  });
  el("delete").addEventListener("click", function () {
    if (selected) deletePlans([selected.slug], "“" + selected.title + "”");
  });
  el("refresh").addEventListener("click", load);
  window.addEventListener("focus", load); // keep mtimes fresh when returning

  // --- bulk + time-based deletion -------------------------------------------
  el("bulkClear").addEventListener("click", function () {
    selectedSlugs.clear();
    renderList();
  });
  el("bulkDelete").addEventListener("click", function () {
    deletePlans(Array.from(selectedSlugs), "(selected)");
  });
  document.querySelectorAll("[data-del-days]").forEach(function (b) {
    b.addEventListener("click", function () {
      var days = parseInt(b.dataset.delDays, 10);
      var cutoff = Date.now() / 1000 - days * 86400;
      var slugs = plans.filter(function (p) { return p.mtime >= cutoff; })
                       .map(function (p) { return p.slug; });
      deletePlans(slugs, "modified in the last " + days + " days");
    });
  });

  // --- settings modal -------------------------------------------------------
  var defaultDir = "";
  function openSettings() {
    el("modalErr").textContent = "";
    fetch("/api/config", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        defaultDir = cfg.default_plans_dir || "";
        el("planDir").value = cfg.plans_dir || "";
        el("defaultDir").textContent = defaultDir;
        el("modal").style.display = "flex";
        el("planDir").focus();
        el("planDir").select();
      });
  }
  function closeSettings() { el("modal").style.display = "none"; }
  function saveSettings() {
    var dir = el("planDir").value.trim();
    el("modalErr").textContent = "";
    fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plans_dir: dir }),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || res.j.error) {
          el("modalErr").textContent = res.j.error || "Could not set directory.";
          return;
        }
        closeSettings();
        selected = null;
        location.hash = "";
        load().then(function () { toast("Plans directory updated"); });
      })
      .catch(function () { el("modalErr").textContent = "Request failed."; });
  }

  el("settings").addEventListener("click", openSettings);
  el("cancelCfg").addEventListener("click", closeSettings);
  el("saveCfg").addEventListener("click", saveSettings);
  el("useDefault").addEventListener("click", function () {
    el("planDir").value = defaultDir;
    el("planDir").focus();
  });
  el("planDir").addEventListener("keydown", function (e) {
    if (e.key === "Enter") saveSettings();
  });
  el("modal").addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSettings();
  });
  el("modal").addEventListener("click", function (e) {
    if (e.target === el("modal")) closeSettings(); // click backdrop to dismiss
  });

  load();
})();
</script>
</body>
</html>
